name: Verifiquei a execução local
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]' -c requirements.lock
      - run: ruff check src tests app.py evaluation/run.py
      - run: pytest -q -m 'not integration'
