[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-musica"
version = "0.1.0"
description = "Meu protótipo de atendimento para o desafio AI Engineer da Artefact"
requires-python = ">=3.10"
dependencies = [
  "langgraph==1.2.19", "langchain-openrouter==0.2.9",
  "psycopg[binary]==3.3.6", "pgvector==0.5.1",
  "python-dotenv==1.2.4", "pypdf==6.21.4", "pydantic==2.12.5",
  "httpx==0.28.1", "rich==15.0.0", "streamlit==1.65.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[project.scripts]
emporio = "emporio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: usa Supabase e OpenRouter reais (custo de API)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
